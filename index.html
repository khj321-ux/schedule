<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6174e8" />
    <title>매일의 일정</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="rangeLabel">3개월 일정 보기</p>
          <h1>매일의 일정</h1>
        </div>
        <div class="header-actions">
          <button class="history-button" id="historyButton" type="button">지난 일정 보기</button>
          <button class="today-button" id="todayButton" type="button">오늘</button>
        </div>
      </header>

      <section class="intro-card">
        <span class="calendar-mark" aria-hidden="true">✦</span>
        <div>
          <strong id="todayText"></strong>
          <div class="today-summary" id="todaySchedule"></div>
        </div>
      </section>

      <section class="calendar-grid" id="calendarGrid" aria-label="3개월 달력"></section>
    </main>

    <dialog id="eventDialog">
      <form method="dialog" id="eventForm">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">새 일정</p>
            <h2 id="dialogDate"></h2>
          </div>
          <button class="icon-button" id="closeDialog" type="button" aria-label="닫기">×</button>
        </div>
        <section class="saved-events" id="savedEvents" aria-label="등록된 일정"></section>
        <label>
          일정 내용
          <input id="eventTitle" name="title" maxlength="60" placeholder="예: 병원 예약" required autofocus />
        </label>
        <label>
          색상
          <select id="eventColor" name="color">
            <option value="violet">보라</option>
            <option value="coral">코랄</option>
            <option value="mint">민트</option>
            <option value="sun">노랑</option>
          </select>
        </label>
        <menu>
          <button type="button" class="secondary" id="cancelButton">취소</button>
          <button type="submit" class="primary" id="saveButton">저장</button>
        </menu>
      </form>
    </dialog>

    <dialog id="historyDialog">
      <form method="dialog">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">지난 일정</p>
            <h2>월을 선택하세요</h2>
          </div>
          <button class="icon-button" value="cancel" aria-label="닫기">×</button>
        </div>
        <label>
          지난 일정
          <select id="historyMonthSelect"></select>
        </label>
        <menu>
          <button value="cancel" class="secondary">취소</button>
          <button type="button" class="primary" id="openHistoryButton">일정 보기</button>
        </menu>
      </form>
    </dialog>

    <script src="app.js"></script>
    <script>
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js');
    </script>
  </body>
</html>
